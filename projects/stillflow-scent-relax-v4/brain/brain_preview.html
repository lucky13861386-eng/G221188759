<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family:"Noto Sans TC"; font-weight:700; src:url("NotoSansTC-Bold.otf"); }
  @font-face { font-family:"Noto Sans TC"; font-weight:900; src:url("NotoSansTC-Black.otf"); }
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif;}
  #frame{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(130% 100% at 50% 40%,#f7eedd 0%,#efdcc2 62%,#e4cba7 100%);}
  .lbl{position:absolute;font-size:38px;font-weight:900;color:#3a2b18;background:rgba(255,251,243,.96);border-radius:15px;padding:7px 20px;white-space:nowrap;box-shadow:0 6px 20px rgba(120,80,40,.22);}
  .lbl small{font-weight:700;font-size:26px;color:#8a6a40;}
  #tag{position:absolute;right:30px;bottom:30px;font-size:30px;color:#9a7a50;font-weight:700;}
  #title{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:62px;font-weight:900;color:#4a3320;}
</style>
</head>
<body>
<div id="frame">
  <div id="title"></div>
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="gGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe6a8"/><stop offset="45%" stop-color="#f3b24d" stop-opacity=".85"/><stop offset="100%" stop-color="#f3b24d" stop-opacity="0"/></radialGradient>
      <radialGradient id="gLav" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#cdbbf0"/><stop offset="45%" stop-color="#9b86c9" stop-opacity=".9"/><stop offset="100%" stop-color="#9b86c9" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="world" transform="translate(0,0) scale(1)">
      <!-- 頭部側面（面朝左） -->
      <path id="head" d="M660,496 C470,496 348,556 326,680 C312,744 292,792 242,860 C212,892 218,922 254,930
        C274,936 288,952 285,978 C278,1014 304,1058 366,1074 C424,1132 524,1162 586,1162 L586,1320 L826,1320
        C906,1100 946,900 946,760 C946,600 840,496 660,496 Z"
        fill="#f1dcc0" stroke="#caa178" stroke-width="5"/>
      <!-- 專業大腦插畫（Patrick Lynch, CC BY；向量） -->
      <image id="brainimg" href="lynch.svg" x="300" y="560" width="620" height="686" preserveAspectRatio="xMidYMid meet"/>

      <!-- 鼻腔 -->
      <path id="nasal" d="M258,936 C280,944 292,974 282,1006 L266,1050 C250,1026 246,980 258,936 Z" fill="#efc9a0" stroke="#caa178" stroke-width="3"/>
      <!-- 嗅徑 -->
      <path id="tract" d="M408,930 L520,906" stroke="#e8a94e" stroke-width="10" stroke-linecap="round"/>
      <!-- 嗅球 -->
      <ellipse id="bulb" cx="398" cy="934" rx="30" ry="18" fill="#efb052" stroke="#c9842f" stroke-width="3"/>
      <!-- 視丘標記（疊在插畫視丘位置） -->
      <ellipse id="thal" cx="610" cy="806" rx="34" ry="30" fill="#8fb0d6" fill-opacity=".0" stroke="#5f85b0" stroke-width="0"/>
      <!-- 杏仁核 -->
      <ellipse id="amy" cx="530" cy="958" rx="22" ry="18" fill="#c79ad8" stroke="#9a6cb4" stroke-width="3"/>
      <!-- 海馬迴 -->
      <path id="hip" d="M566,968 C600,966 616,992 600,1016 C586,1036 556,1032 552,1010 C550,994 566,990 576,998" fill="none" stroke="#9b86c9" stroke-width="13" stroke-linecap="round"/>

      <!-- 發光層 -->
      <circle id="glow-bulb" cx="398" cy="934" r="95" fill="url(#gGold)" opacity="0"/>
      <circle id="glow-amy" cx="534" cy="972" r="78" fill="url(#gLav)" opacity="0"/>
      <circle id="glow-hip" cx="580" cy="1010" r="90" fill="url(#gLav)" opacity="0"/>
      <!-- 光路徑 -->
      <path id="path" d="M262,1030 C300,984 350,948 398,934 C446,926 500,930 540,966 C560,984 572,996 580,1010"
        fill="none" stroke="#ffcf7a" stroke-width="9" stroke-linecap="round" opacity="0" style="filter:drop-shadow(0 0 8px rgba(255,190,90,.9))"/>
      <!-- 視丘打叉 -->
      <g id="thalx" opacity="0"><circle cx="610" cy="806" r="42" fill="rgba(140,140,140,.9)"/><path d="M586,782 L634,830 M634,782 L586,830" stroke="#ce4a3c" stroke-width="10" stroke-linecap="round"/></g>
      <!-- 切割線 -->
      <line id="cutline" x1="280" y1="520" x2="860" y2="1140" stroke="#fff3d6" stroke-width="12" opacity="0" style="filter:drop-shadow(0 0 14px rgba(255,220,150,.95))"/>
      <!-- 香氣粒子 -->
      <g id="particles" fill="#f3b24d"><circle cx="150" cy="980" r="9"/><circle cx="205" cy="948" r="7"/><circle cx="238" cy="998" r="8"/><circle cx="180" cy="1026" r="6"/><circle cx="270" cy="968" r="7"/></g>
    </g>
  </svg>
  <div id="lab-bulb" class="lbl" style="display:none">嗅球</div>
  <div id="lab-thal" class="lbl" style="display:none">視丘<small>　轉運站</small></div>
  <div id="lab-amy" class="lbl" style="display:none">杏仁核<small>　情緒</small></div>
  <div id="lab-hip" class="lbl" style="display:none">海馬迴<small>　記憶</small></div>
  <div id="bubble" style="display:none;position:absolute;width:300px;height:300px;border-radius:50%;background:#fff7ec;box-shadow:0 12px 44px rgba(120,80,40,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <b style="font-size:48px;font-weight:900;color:#4a3320">外婆家</b><span style="font-size:34px;color:#8a6a40;margin-top:6px">安心的午後</span></div>
  <div id="tag">示意圖</div>
</div>
<script>
const q=new URLSearchParams(location.search), kf=+(q.get("kf")||1);
const $=s=>document.querySelector(s);
function cam(px,py,s){ $("#world").setAttribute("transform",`translate(${540-px*s},${960-py*s}) scale(${s})`); }
function show(id,o=1){ const e=$(id); if(e){e.style.opacity=o; if(e.tagName!=='DIV') e.setAttribute("opacity",o);} }
function lab(id,x,y){ const e=$(id); e.style.display="block"; e.style.left=x+"px"; e.style.top=y+"px"; }
if(kf===1){ $("#title").textContent="就是用你的鼻子"; cam(540,900,1.0);
  ["#brainimg","#nasal","#tract","#bulb","#amy","#hip"].forEach(id=>$(id).style.display="none"); }
if(kf===2){ $("#title").textContent="剖面打開"; cam(560,840,1.1); $("#head").setAttribute("fill-opacity",".28"); show("#cutline",1); $("#particles").setAttribute("opacity","0"); }
if(kf===3){ $("#title").textContent="氣味分子進到嗅球"; cam(430,930,1.7); $("#head").setAttribute("fill-opacity",".22"); show("#glow-bulb",1); show("#path",1); $("#bulb").setAttribute("rx","34"); $("#bulb").setAttribute("ry","22"); lab("#lab-bulb",430,600); }
if(kf===4){ $("#title").textContent="管情緒和記憶的邊緣系統"; cam(560,975,1.7); $("#head").setAttribute("fill-opacity",".2"); show("#glow-amy",1); show("#glow-hip",1); show("#thalx",1); show("#path",.5); lab("#lab-amy",230,1210); lab("#lab-hip",720,1210); const b=$("#bubble"); b.style.display="flex"; b.style.left="680px"; b.style.top="800px"; }
</script>
</body>
</html>
