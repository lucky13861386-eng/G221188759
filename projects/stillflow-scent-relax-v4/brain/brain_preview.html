<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family:"Noto Sans TC"; font-weight:700; src:url("NotoSansTC-Bold.otf"); }
  @font-face { font-family:"Noto Sans TC"; font-weight:900; src:url("NotoSansTC-Black.otf"); }
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif;}
  #frame{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(130% 100% at 50% 42%,#f7eedd 0%,#efdcc2 60%,#e4cba7 100%);}
  .lbl{position:absolute;font-size:40px;font-weight:900;color:#3a2b18;background:rgba(255,251,243,.96);border-radius:16px;padding:8px 22px;white-space:nowrap;box-shadow:0 6px 20px rgba(120,80,40,.22);}
  .lbl small{font-weight:700;font-size:27px;color:#8a6a40;}
  #tag{position:absolute;right:30px;bottom:30px;font-size:30px;color:#9a7a50;font-weight:700;}
  #title{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:64px;font-weight:900;color:#4a3320;}
</style>
</head>
<body>
<div id="frame">
  <div id="title"></div>
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="gGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe6a8"/><stop offset="45%" stop-color="#f3b24d" stop-opacity=".85"/><stop offset="100%" stop-color="#f3b24d" stop-opacity="0"/></radialGradient>
      <radialGradient id="gLav" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#cdbbf0"/><stop offset="45%" stop-color="#9b86c9" stop-opacity=".9"/><stop offset="100%" stop-color="#9b86c9" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="world" transform="translate(0,0) scale(1)">
      <!-- 專業大腦插畫置中（Patrick Lynch, CC BY；向量） -->
      <image id="brainimg" href="lynch.svg" x="200" y="500" width="680" height="751" preserveAspectRatio="xMidYMid meet"/>

      <!-- 嗅徑 --><path id="tract" d="M360,858 L444,884" stroke="#e8a94e" stroke-width="11" stroke-linecap="round"/>
      <!-- 嗅球 --><ellipse id="bulb" cx="338" cy="860" rx="30" ry="18" fill="#efb052" stroke="#c9842f" stroke-width="3"/>
      <!-- 杏仁核 --><ellipse id="amy" cx="449" cy="896" rx="22" ry="17" fill="#c79ad8" stroke="#9a6cb4" stroke-width="3"/>
      <!-- 海馬迴 --><path id="hip" d="M495,906 C525,904 540,930 525,950 C513,966 488,963 484,944 C482,930 496,926 505,934" fill="none" stroke="#9b86c9" stroke-width="13" stroke-linecap="round"/>
      <circle id="glow-bulb" cx="338" cy="860" r="95" fill="url(#gGold)" opacity="0"/>
      <circle id="glow-amy" cx="451" cy="902" r="76" fill="url(#gLav)" opacity="0"/>
      <circle id="glow-hip" cx="500" cy="944" r="86" fill="url(#gLav)" opacity="0"/>
      <path id="path" d="M292,1012 C320,940 352,884 338,860 C400,872 440,884 470,924 C486,944 496,956 500,944"
        fill="none" stroke="#ffcf7a" stroke-width="9" stroke-linecap="round" opacity="0" style="filter:drop-shadow(0 0 8px rgba(255,190,90,.9))"/>
      <g id="thalx" opacity="0"><circle cx="555" cy="746" r="40" fill="rgba(140,140,140,.9)"/><path d="M533,724 L577,768 M577,724 L533,768" stroke="#ce4a3c" stroke-width="9" stroke-linecap="round"/></g>
      <!-- 香氣粒子（從下方鼻子方向飄入嗅球） -->
      <g id="particles" fill="#f3b24d"><circle cx="250" cy="1120" r="11"/><circle cx="310" cy="1070" r="8"/><circle cx="286" cy="1150" r="9"/><circle cx="210" cy="1080" r="7"/><circle cx="340" cy="1030" r="8"/></g>
    </g>
  </svg>
  <div id="lab-bulb" class="lbl" style="display:none">嗅球</div>
  <div id="lab-thal" class="lbl" style="display:none">視丘<small>　轉運站</small></div>
  <div id="lab-amy" class="lbl" style="display:none">杏仁核<small>　情緒</small></div>
  <div id="lab-hip" class="lbl" style="display:none">海馬迴<small>　記憶</small></div>
  <div id="bubble" style="display:none;position:absolute;width:300px;height:300px;border-radius:50%;background:#fff7ec;box-shadow:0 12px 44px rgba(120,80,40,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <b style="font-size:48px;font-weight:900;color:#4a3320">外婆家</b><span style="font-size:34px;color:#8a6a40;margin-top:6px">安心的午後</span></div>
  <div id="tag">示意圖</div>
</div>
<script>
const q=new URLSearchParams(location.search), kf=+(q.get("kf")||1);
const $=s=>document.querySelector(s);
function cam(px,py,s){ $("#world").setAttribute("transform",`translate(${540-px*s},${960-py*s}) scale(${s})`); }
function show(id,o=1){ const e=$(id); if(e){e.style.opacity=o; if(e.tagName!=='DIV') e.setAttribute("opacity",o);} }
function lab(id,x,y){ const e=$(id); e.style.display="block"; e.style.left=x+"px"; e.style.top=y+"px"; }
if(kf===1){ $("#title").textContent="就是用你的鼻子"; cam(540,870,1.0);
  ["#tract","#bulb","#amy","#hip"].forEach(id=>$(id).style.display="none"); }
if(kf===2){ $("#title").textContent="氣味分子進到鼻子"; cam(420,880,1.25); show("#bulb"); lab("#lab-bulb",430,590); }
if(kf===3){ $("#title").textContent="氣味分子進到嗅球"; cam(360,880,1.9); show("#glow-bulb",1); show("#path",1); $("#bulb").setAttribute("rx","34"); $("#bulb").setAttribute("ry","22"); lab("#lab-bulb",420,560); }
if(kf===4){ $("#title").textContent="管情緒和記憶的邊緣系統"; cam(470,910,1.8); show("#glow-amy",1); show("#glow-hip",1); show("#thalx",1); show("#path",.5); lab("#lab-amy",220,1250); lab("#lab-hip",720,1250); const b=$("#bubble"); b.style.display="flex"; b.style.left="700px"; b.style.top="800px"; }
</script>
</body>
</html>
